<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Territory With Flags</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ccc;
    }

    /* === TWO-COLUMN LAYOUT === */
    .app-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      grid-template-rows: auto 1fr;
      width: 100vw;
      height: 100vh;
      gap: 0;
    }

    /* === LEFT SIDEBAR === */
    .left-sidebar {
      grid-row: 1 / -1;
      grid-column: 1;
      background: #111;
      border-right: 1px solid #222;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 10px 12px 6px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #666;
      border-bottom: 1px solid #222;
    }

    /* === LEADERBOARD === */
    .leaderboard {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .leaderboard:empty::after {
      content: 'Waiting for game...';
      display: block;
      padding: 12px;
      color: #444;
      font-size: 11px;
      font-style: italic;
    }
    .lb-entry {
      display: flex;
      align-items: center;
      padding: 5px 12px;
      gap: 8px;
      transition: background 0.15s;
      font-size: 12px;
      font-family: 'Consolas', 'Courier New', monospace;
    }
    .lb-entry:hover {
      background: rgba(255,255,255,0.03);
    }
    .lb-entry.eliminated {
      opacity: 0.35;
    }
    .lb-entry.eliminated-removed {
      opacity: 0.15;
      text-decoration: line-through;
    }
    .lb-rank {
      width: 16px;
      text-align: right;
      color: #555;
      font-size: 10px;
    }
    .lb-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .lb-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lb-kills {
      color: #888;
      font-size: 11px;
      min-width: 24px;
      text-align: right;
    }

    /* === ROUND BANNER === */
    .round-banner {
      padding: 5px 12px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      text-align: center;
      color: #0ff;
      background: #0d0d0d;
      border-bottom: 1px solid #1c1c1c;
    }

    /* === TEAM SCOREBOARD === */
    .sb-entry {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-family: 'Consolas', 'Courier New', monospace;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .sb-entry:hover {
      background: rgba(255,255,255,0.03);
    }
    .sb-rank {
      width: 14px;
      text-align: right;
      color: #555;
      font-size: 10px;
    }
    .sb-flag {
      width: 24px;
      height: 16px;
      object-fit: cover;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .sb-emoji {
      width: 24px;
      font-size: 15px;
      text-align: center;
      flex-shrink: 0;
    }
    .sb-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sb-crown {
      color: #FFD700;
      margin-left: 4px;
    }
    .sb-entry.out {
      opacity: 0.3;
      text-decoration: line-through;
    }
    .sb-terr {
      color: #777;
      font-size: 10px;
      min-width: 34px;
      text-align: right;
    }

    /* === GAME OVER PANEL === */
    .game-over-panel {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px;
      border-top: 1px solid #222;
      text-align: center;
    }
    .game-over-panel.visible {
      display: flex;
    }
    .go-title {
      font-size: 20px;
      font-weight: bold;
      color: #FFD700;
      margin-bottom: 6px;
    }
    .go-winner {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .go-stat {
      font-size: 11px;
      color: #888;
      margin-bottom: 2px;
    }
    .go-supporters {
      margin-top: 10px;
      width: 100%;
    }
    .go-supporters h4 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 6px 0 3px;
      color: #555;
    }
    .go-supporters .legend { color: #FFD700; }
    .go-supporters .king { color: #C0C0C0; }
    .go-supporters span {
      display: block;
      font-size: 10px;
      color: #777;
      padding: 1px 0;
    }
    .go-play-again {
      margin-top: 10px;
      padding: 6px 20px;
      background: rgba(0, 180, 80, 0.9);
      border: 1px solid #0f8;
      color: #fff;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      border-radius: 3px;
    }
    .go-play-again:hover {
      background: rgba(0, 220, 100, 0.95);
    }
    .go-hint {
      font-size: 10px;
      color: #555;
      margin-top: 4px;
    }
    .go-reason {
      font-size: 11px;
      color: #FFD700;
      font-style: italic;
      margin-bottom: 4px;
      min-height: 14px;
    }

    /* === CENTER COLUMN === */
    .center-column {
      grid-row: 1 / -1;
      grid-column: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* === TOP CONTROL BAR === */
    .control-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      width: 100%;
      justify-content: center;
      background: #0e0e0e;
      border-bottom: 1px solid #1a1a1a;
      flex-shrink: 0;
    }
    .ctrl-btn {
      padding: 4px 10px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #aaa;
      font-size: 11px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-weight: bold;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.12s;
      user-select: none;
    }
    .ctrl-btn:hover {
      background: #2a2a2a;
      color: #fff;
      border-color: #555;
    }
    .ctrl-btn.active {
      background: rgba(0, 180, 80, 0.85);
      border-color: #0f8;
      color: #fff;
    }
    .ctrl-btn.speed-active {
      background: rgba(255, 215, 0, 0.2);
      border-color: #FFD700;
      color: #FFD700;
    }
    .game-timer.timer-warning {
      color: #FFD700 !important;
      border-color: #FFD700 !important;
    }
    .game-timer.timer-critical {
      color: #FF4444 !important;
      border-color: #FF4444 !important;
      animation: timer-pulse 0.5s infinite;
    }
    @keyframes timer-pulse {
      50% { opacity: 0.6; }
    }
    select.ctrl-btn {
      appearance: auto;
      cursor: pointer;
      padding-right: 6px;
    }
    .ctrl-sep {
      width: 1px;
      height: 18px;
      background: #333;
      margin: 0 4px;
    }
    .speed-label {
      font-size: 10px;
      color: #666;
      margin-right: 2px;
    }

    /* === CANVAS AREA === */
    .canvas-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
    }
    canvas#game-canvas {
      display: block;
      border: 2px solid #222;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      cursor: default;
      aspect-ratio: 1200 / 800;
      max-width: 100%;
      max-height: 100%;
    }

    /* === PAUSE OVERLAY (on canvas) === */
    .pause-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.55);
      pointer-events: none;
      z-index: 5;
    }
    .pause-overlay.visible {
      display: flex;
    }
    .pause-overlay .pause-text {
      font-size: 48px;
      font-weight: bold;
      color: #fff;
      font-family: 'Consolas', monospace;
    }
    .pause-overlay .pause-hint {
      font-size: 14px;
      color: #888;
      margin-top: 10px;
    }

    /* === DEBUG PANEL (floating, draggable) === */
    .debug-panel {
      position: fixed;
      top: 60px;
      left: 240px;
      width: 260px;
      background: rgba(10, 10, 10, 0.92);
      border: 1px solid #333;
      border-radius: 6px;
      z-index: 100;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      display: none;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .debug-panel.visible {
      display: flex;
    }
    .debug-panel.collapsed .debug-body {
      display: none;
    }
    .debug-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      cursor: grab;
      user-select: none;
      border-radius: 6px 6px 0 0;
    }
    .debug-header:active {
      cursor: grabbing;
    }
    .debug-title {
      font-weight: bold;
      color: #0ff;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .debug-collapse-btn {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
      line-height: 1;
    }
    .debug-collapse-btn:hover {
      color: #fff;
    }
    .debug-icon-btn {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 12px;
      padding: 0 4px;
      line-height: 1;
    }
    .debug-icon-btn:hover {
      color: #fff;
    }
    .debug-tabs {
      display: flex;
      gap: 2px;
      padding: 6px 6px 0;
      border-bottom: 1px solid #2a2a2a;
      flex-wrap: wrap;
    }
    .debug-tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #777;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 5px 7px;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s;
    }
    .debug-tab:hover {
      color: #bbb;
    }
    .debug-tab.active {
      color: #0ff;
      border-bottom-color: #0ff;
    }
    .debug-tab-panel {
      display: none;
    }
    .debug-tab-panel.active {
      display: block;
    }
    .debug-fab {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(0, 255, 255, 0.35);
      background: rgba(10, 14, 16, 0.5);
      color: rgba(0, 255, 255, 0.8);
      font-size: 19px;
      line-height: 1;
      cursor: grab;
      z-index: 300;
      opacity: 0.35;
      backdrop-filter: blur(4px);
      transition: opacity 0.15s, transform 0.15s, background 0.15s;
      touch-action: none;
      user-select: none;
    }
    .debug-fab:hover {
      opacity: 0.95;
      transform: scale(1.06);
    }
    .debug-fab.active {
      opacity: 0.95;
      background: rgba(0, 255, 255, 0.15);
      border-color: #0ff;
      color: #0ff;
    }
    .debug-fab:active {
      cursor: grabbing;
    }
    .debug-body {
      padding: 8px;
      max-height: 420px;
      overflow-y: auto;
    }
    .debug-section {
      margin-bottom: 8px;
    }
    .debug-section h5 {
      color: #0ff;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      border-bottom: 1px solid #222;
      padding-bottom: 2px;
    }
    .debug-row {
      display: flex;
      justify-content: space-between;
      padding: 1px 0;
      color: #aaa;
    }
    .debug-row .val {
      color: #fff;
    }
    .debug-tile-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 4px;
    }
    .debug-tile-item {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 9px;
    }
    .debug-tile-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* === TEAM EDITOR === */
    .team-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 0;
      border-bottom: 1px solid #1c1c1c;
    }
    .team-index {
      width: 12px;
      text-align: center;
      color: #666;
      font-size: 9px;
    }
    .team-emoji {
      font-size: 13px;
      width: 16px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .team-flag-preview {
      width: 16px;
      height: 11px;
      object-fit: cover;
      border-radius: 2px;
      display: block;
    }
    .team-color {
      width: 18px;
      height: 18px;
      padding: 0;
      border: 1px solid #333;
      background: #111;
      cursor: pointer;
    }
    .team-name {
      width: 0;
      flex: 1;
      min-width: 0;
      background: #111;
      border: 1px solid #333;
      color: #ddd;
      font-size: 9px;
      padding: 2px 3px;
      font-family: inherit;
    }
    .team-iso {
      width: 30px;
      background: #111;
      border: 1px solid #333;
      color: #ddd;
      font-size: 9px;
      padding: 2px 3px;
      text-align: center;
      font-family: inherit;
    }
    .team-flag {
      width: 54px;
      font-size: 8px;
      color: #777;
    }
    .team-remove {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 11px;
      padding: 0 2px;
    }
    .team-remove:hover {
      color: #ff5555;
    }

    /* === MAPPINGS EDITOR === */
    .mapping-row {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 3px 0;
      border-bottom: 1px solid #1c1c1c;
    }
    .mapping-input {
      width: 0;
      flex: 1;
      min-width: 0;
      background: #111;
      border: 1px solid #333;
      color: #ddd;
      font-size: 9px;
      padding: 2px 3px;
      font-family: inherit;
    }
    .mapping-coins {
      width: 40px;
      background: #111;
      border: 1px solid #333;
      color: #ddd;
      font-size: 9px;
      padding: 2px 3px;
      font-family: inherit;
    }
    .mapping-select {
      width: 78px;
      background: #111;
      border: 1px solid #333;
      color: #ddd;
      font-size: 9px;
      padding: 2px;
      font-family: inherit;
    }
    .mapping-remove {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 11px;
      padding: 0 2px;
    }
    .mapping-remove:hover {
      color: #ff5555;
    }

    /* === SCROLLBAR === */
    .leaderboard::-webkit-scrollbar { width: 4px; }
    .leaderboard::-webkit-scrollbar-track { background: transparent; }
    .leaderboard::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- LEFT SIDEBAR -->
    <aside class="left-sidebar">
      <div class="sidebar-header" data-i18n="sidebar.leaderboard">Leaderboard</div>
      <div class="round-banner" id="round-state">IDLE</div>
      <div class="leaderboard" id="leaderboard"></div>

      <div class="game-over-panel" id="game-over-panel">
        <div class="go-title" data-i18n="gameover.title">VICTORY</div>
        <div class="go-winner" id="go-winner"></div>
        <div class="go-stat" id="go-tiles"></div>
        <div class="go-stat" id="go-duration"></div>
        <div class="go-reason" id="go-reason"></div>
        <button class="go-play-again" id="go-restart" data-i18n="gameover.playAgain">Play Again</button>
        <div class="go-hint" data-i18n="gameover.hint">or press R to restart</div>
      </div>
    </aside>

    <!-- CENTER COLUMN -->
    <main class="center-column">
      <div class="control-bar" id="control-bar">
        <button class="ctrl-btn" id="btn-pause" title="Space" data-i18n="control.pause">Pause</button>
        <div class="ctrl-sep"></div>
        <span class="speed-label" data-i18n="control.speed">Speed:</span>
        <button class="ctrl-btn speed-active" id="btn-1x" title="1">1x</button>
        <button class="ctrl-btn" id="btn-2x" title="2">2x</button>
        <button class="ctrl-btn" id="btn-4x" title="3">4x</button>
        <div class="ctrl-sep"></div>
        <span class="ctrl-btn game-timer" id="game-timer" style="cursor:default;min-width:50px;text-align:center;">1:30</span>
        <div class="ctrl-sep"></div>
        <span class="speed-label" data-i18n="control.map">Map:</span>
        <select class="ctrl-btn" id="map-select" title="Map Layout" data-i18n-title="control.mapTitle">
          <option value="Empty" data-i18n="map.empty">Empty</option>
          <option value="Crossfire" data-i18n="map.crossfire">Crossfire</option>
          <option value="Islands" data-i18n="map.islands">Islands</option>
        </select>
        <div class="ctrl-sep"></div>
        <button class="ctrl-btn" id="btn-mute" title="M" data-i18n="control.mute">Mute</button>
        <button class="ctrl-btn" id="btn-restart" title="R" data-i18n="control.restart">Restart</button>
        <div class="ctrl-sep"></div>
        <button class="ctrl-btn" id="btn-round-start" data-i18n="control.start">Start</button>
        <button class="ctrl-btn" id="btn-round-end" data-i18n="control.end">End</button>
        <button class="ctrl-btn active" id="btn-round-auto" data-i18n="control.auto">Auto</button>
      </div>

      <div class="canvas-wrap">
        <canvas id="game-canvas" width="1200" height="800"></canvas>
        <div class="pause-overlay" id="pause-overlay">
          <div class="pause-text" data-i18n="pause.paused">PAUSED</div>
          <div class="pause-hint" data-i18n="pause.hint">Press Space to resume</div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
