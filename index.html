<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Territory With Swords</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ccc;
    }

    /* === THREE-COLUMN LAYOUT === */
    .app-layout {
      display: grid;
      grid-template-columns: 220px 1fr 0px;
      grid-template-rows: auto 1fr;
      width: 100vw;
      height: 100vh;
      gap: 0;
    }

    /* === LEFT SIDEBAR === */
    .left-sidebar {
      grid-row: 1 / -1;
      grid-column: 1;
      background: #111;
      border-right: 1px solid #222;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 10px 12px 6px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #666;
      border-bottom: 1px solid #222;
    }

    /* === LEADERBOARD === */
    .leaderboard {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .leaderboard:empty::after {
      content: 'Waiting for game...';
      display: block;
      padding: 12px;
      color: #444;
      font-size: 11px;
      font-style: italic;
    }
    .lb-entry {
      display: flex;
      align-items: center;
      padding: 5px 12px;
      gap: 8px;
      transition: background 0.15s;
      font-size: 12px;
      font-family: 'Consolas', 'Courier New', monospace;
    }
    .lb-entry:hover {
      background: rgba(255,255,255,0.03);
    }
    .lb-entry.eliminated {
      opacity: 0.35;
    }
    .lb-entry.eliminated-removed {
      opacity: 0.15;
      text-decoration: line-through;
    }
    .lb-rank {
      width: 16px;
      text-align: right;
      color: #555;
      font-size: 10px;
    }
    .lb-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .lb-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lb-kills {
      color: #888;
      font-size: 11px;
      min-width: 24px;
      text-align: right;
    }

    /* === GAME OVER PANEL === */
    .game-over-panel {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px;
      border-top: 1px solid #222;
      text-align: center;
    }
    .game-over-panel.visible {
      display: flex;
    }
    .go-title {
      font-size: 20px;
      font-weight: bold;
      color: #FFD700;
      margin-bottom: 6px;
    }
    .go-winner {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .go-stat {
      font-size: 11px;
      color: #888;
      margin-bottom: 2px;
    }
    .go-supporters {
      margin-top: 10px;
      width: 100%;
    }
    .go-supporters h4 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 6px 0 3px;
      color: #555;
    }
    .go-supporters .legend { color: #FFD700; }
    .go-supporters .king { color: #C0C0C0; }
    .go-supporters span {
      display: block;
      font-size: 10px;
      color: #777;
      padding: 1px 0;
    }
    .go-play-again {
      margin-top: 10px;
      padding: 6px 20px;
      background: rgba(0, 180, 80, 0.9);
      border: 1px solid #0f8;
      color: #fff;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      border-radius: 3px;
    }
    .go-play-again:hover {
      background: rgba(0, 220, 100, 0.95);
    }
    .go-hint {
      font-size: 10px;
      color: #555;
      margin-top: 4px;
    }
    .go-reason {
      font-size: 11px;
      color: #FFD700;
      font-style: italic;
      margin-bottom: 4px;
      min-height: 14px;
    }

    /* === CENTER COLUMN === */
    .center-column {
      grid-row: 1 / -1;
      grid-column: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* === TOP CONTROL BAR === */
    .control-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      width: 100%;
      justify-content: center;
      background: #0e0e0e;
      border-bottom: 1px solid #1a1a1a;
      flex-shrink: 0;
    }
    .ctrl-btn {
      padding: 4px 10px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #aaa;
      font-size: 11px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-weight: bold;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.12s;
      user-select: none;
    }
    .ctrl-btn:hover {
      background: #2a2a2a;
      color: #fff;
      border-color: #555;
    }
    .ctrl-btn.active {
      background: rgba(0, 180, 80, 0.85);
      border-color: #0f8;
      color: #fff;
    }
    .ctrl-btn.speed-active {
      background: rgba(255, 215, 0, 0.2);
      border-color: #FFD700;
      color: #FFD700;
    }
    .game-timer.timer-warning {
      color: #FFD700 !important;
      border-color: #FFD700 !important;
    }
    .game-timer.timer-critical {
      color: #FF4444 !important;
      border-color: #FF4444 !important;
      animation: timer-pulse 0.5s infinite;
    }
    @keyframes timer-pulse {
      50% { opacity: 0.6; }
    }
    select.ctrl-btn {
      appearance: auto;
      cursor: pointer;
      padding-right: 6px;
    }
    .ctrl-sep {
      width: 1px;
      height: 18px;
      background: #333;
      margin: 0 4px;
    }
    .speed-label {
      font-size: 10px;
      color: #666;
      margin-right: 2px;
    }

    /* === CANVAS AREA === */
    .canvas-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
    }
    canvas#game-canvas {
      display: block;
      border: 2px solid #222;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      cursor: default;
      aspect-ratio: 1200 / 800;
      max-width: 100%;
      max-height: 100%;
    }

    /* === PAUSE OVERLAY (on canvas) === */
    .pause-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.55);
      pointer-events: none;
      z-index: 5;
    }
    .pause-overlay.visible {
      display: flex;
    }
    .pause-overlay .pause-text {
      font-size: 48px;
      font-weight: bold;
      color: #fff;
      font-family: 'Consolas', monospace;
    }
    .pause-overlay .pause-hint {
      font-size: 14px;
      color: #888;
      margin-top: 10px;
    }

    /* === DEBUG PANEL (floating, draggable) === */
    .debug-panel {
      position: fixed;
      top: 60px;
      left: 240px;
      width: 260px;
      background: rgba(10, 10, 10, 0.92);
      border: 1px solid #333;
      border-radius: 6px;
      z-index: 100;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      display: none;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .debug-panel.visible {
      display: flex;
    }
    .debug-panel.collapsed .debug-body {
      display: none;
    }
    .debug-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      cursor: grab;
      user-select: none;
      border-radius: 6px 6px 0 0;
    }
    .debug-header:active {
      cursor: grabbing;
    }
    .debug-title {
      font-weight: bold;
      color: #0ff;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .debug-collapse-btn {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
      line-height: 1;
    }
    .debug-collapse-btn:hover {
      color: #fff;
    }
    .debug-body {
      padding: 8px;
      max-height: 400px;
      overflow-y: auto;
    }
    .debug-section {
      margin-bottom: 8px;
    }
    .debug-section h5 {
      color: #0ff;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      border-bottom: 1px solid #222;
      padding-bottom: 2px;
    }
    .debug-row {
      display: flex;
      justify-content: space-between;
      padding: 1px 0;
      color: #aaa;
    }
    .debug-row .val {
      color: #fff;
    }
    .debug-tile-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 4px;
    }
    .debug-tile-item {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 9px;
    }
    .debug-tile-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* === RIGHT MARGIN (empty) === */
    .right-margin {
      grid-row: 1 / -1;
      grid-column: 3;
    }

    /* === SCROLLBAR === */
    .leaderboard::-webkit-scrollbar { width: 4px; }
    .leaderboard::-webkit-scrollbar-track { background: transparent; }
    .leaderboard::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- LEFT SIDEBAR -->
    <aside class="left-sidebar">
      <div class="sidebar-header">Leaderboard</div>
      <div class="leaderboard" id="leaderboard"></div>

      <div class="game-over-panel" id="game-over-panel">
        <div class="go-title">VICTORY</div>
        <div class="go-winner" id="go-winner"></div>
        <div class="go-stat" id="go-kills"></div>
        <div class="go-stat" id="go-tiles"></div>
        <div class="go-stat" id="go-duration"></div>
        <div class="go-reason" id="go-reason"></div>
        <button class="go-play-again" id="go-restart">Play Again</button>
        <div class="go-hint">or press R to restart</div>
        <div class="go-supporters">
          <h4 class="legend">Marble Legends</h4>
          <span>Aurelius</span><span>Zephyrine</span><span>Ironveil</span><span>Starfall</span>
          <h4 class="king">Marble Kings</h4>
          <span>Gladius</span><span>Thornwick</span><span>Emberlyn</span><span>Crestfall</span><span>Duskara</span>
        </div>
      </div>
    </aside>

    <!-- CENTER COLUMN -->
    <main class="center-column">
      <div class="control-bar" id="control-bar">
        <button class="ctrl-btn" id="btn-pause" title="Space">Pause</button>
        <div class="ctrl-sep"></div>
        <span class="speed-label">Speed:</span>
        <button class="ctrl-btn speed-active" id="btn-1x" title="1">1x</button>
        <button class="ctrl-btn" id="btn-2x" title="2">2x</button>
        <button class="ctrl-btn" id="btn-4x" title="3">4x</button>
        <div class="ctrl-sep"></div>
        <span class="ctrl-btn game-timer" id="game-timer" style="cursor:default;min-width:50px;text-align:center;">1:30</span>
        <div class="ctrl-sep"></div>
        <span class="speed-label">Map:</span>
        <select class="ctrl-btn" id="map-select" title="Map Layout">
          <option value="Empty">Empty</option>
          <option value="Crossfire">Crossfire</option>
          <option value="Islands">Islands</option>
        </select>
        <div class="ctrl-sep"></div>
        <button class="ctrl-btn" id="btn-debug" title="D">Debug</button>
        <button class="ctrl-btn" id="btn-mute" title="M">Mute</button>
        <button class="ctrl-btn" id="btn-restart" title="R">Restart</button>
      </div>

      <div class="canvas-wrap">
        <canvas id="game-canvas" width="1200" height="800"></canvas>
        <div class="pause-overlay" id="pause-overlay">
          <div class="pause-text">PAUSED</div>
          <div class="pause-hint">Press Space to resume</div>
        </div>
      </div>
    </main>

    <!-- RIGHT MARGIN -->
    <div class="right-margin"></div>
  </div>

  <!-- DEBUG PANEL (floating, outside grid) -->
  <div class="debug-panel" id="debug-panel">
    <div class="debug-header" id="debug-drag-handle">
      <span class="debug-title">Debug</span>
      <button class="debug-collapse-btn" id="debug-collapse-btn">&#9660;</button>
    </div>
    <div class="debug-body" id="debug-body">
      <div class="debug-section">
        <h5>Performance</h5>
        <div class="debug-row"><span>FPS</span><span class="val" id="dbg-fps">--</span></div>
        <div class="debug-row"><span>Frame Time</span><span class="val" id="dbg-frametime">--</span></div>
        <div class="debug-row"><span>Map</span><span class="val" id="dbg-map">--</span></div>
        <div class="debug-row"><span>Claimable</span><span class="val" id="dbg-walls">--</span></div>
      </div>
      <div class="debug-section">
        <h5>Particles</h5>
        <div class="debug-row"><span>Active</span><span class="val" id="dbg-particles">--</span></div>
        <div class="debug-row"><span>Pool Free</span><span class="val" id="dbg-pool-free">--</span></div>
      </div>
      <div class="debug-section">
        <h5>Tile Ownership</h5>
        <div class="debug-tile-grid" id="dbg-tiles"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
